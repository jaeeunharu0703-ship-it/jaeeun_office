<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>안양중앙시장 맛집 지도</title>
<meta name="theme-color" content="#FFF7EC">
<meta name="description" content="안양중앙시장 김밥·만두, 떡볶이, 칼국수·곱창, 닭강정·도넛 맛집과 주차장을 한눈에 보는 지도. 영업시간·휴무·가격·포장 팁까지.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="중앙시장 맛집">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%99%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'">
<style>
:root{
  --cream:#FFF7EC; --cream2:#FDEFDD; --card:#FFFDF9;
  --ink:#3B2E24; --ink2:#7B6857; --ink3:#A79684;
  --line:#F0DFCB; --line2:#E7D2BA;
  --brand:#D9482B; --brand-d:#B93A20;
  --shadow:0 8px 24px rgba(120,80,40,.12);
  --shadow-s:0 3px 10px rgba(120,80,40,.10);
  --safe-b:env(safe-area-inset-bottom,0px);
  --sheet-h:0px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
[hidden]{display:none !important;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  background:var(--cream); color:var(--ink); line-height:1.45;
  -webkit-text-size-adjust:100%; overscroll-behavior:none;
}
button{font-family:inherit; cursor:pointer; border:0; background:none; color:inherit;}
a{color:inherit; text-decoration:none;}
.app{display:flex; flex-direction:column; height:100vh; height:100dvh; max-width:820px; margin:0 auto; position:relative; overflow:hidden;}

/* ---------- header ---------- */
header.top{
  flex:0 0 auto; padding:calc(10px + env(safe-area-inset-top)) 14px 6px;
  background:linear-gradient(180deg,#FFF9F0 0%,#FFF7EC 100%);
  position:relative; z-index:30;
}
.hrow{display:flex; align-items:center; gap:10px;}
.hlogo{
  width:40px; height:40px; flex:0 0 auto; border-radius:14px;
  background:linear-gradient(150deg,#FFE2C4,#FFCD9B);
  display:grid; place-items:center; font-size:21px;
  box-shadow:0 3px 10px rgba(200,130,60,.22);
}
.hd{min-width:0; flex:1 1 auto;}
h1{font-size:18px; margin:0; letter-spacing:-.6px; font-weight:800;}
.hsub{margin:1px 0 0; font-size:11.5px; color:var(--ink2); font-weight:600;}
.seg{
  flex:0 0 auto; display:flex; background:#fff; border:1.5px solid var(--line2);
  border-radius:999px; padding:3px; box-shadow:var(--shadow-s);
}
.seg button{
  border-radius:999px; padding:6px 11px; font-size:12px; font-weight:800; color:var(--ink2);
  transition:.16s; line-height:1; display:flex; align-items:center; gap:4px;
}
.seg button.on{background:var(--brand); color:#fff; box-shadow:0 3px 9px rgba(217,72,43,.3);}

/* ---------- chips ---------- */
.chips{
  flex:0 0 auto; display:flex; gap:6px; padding:7px 14px 0;
  overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto; display:flex; align-items:center; gap:5px;
  background:#fff; border:1.5px solid var(--line2); color:var(--ink2);
  border-radius:999px; padding:7px 12px; font-size:12.5px; font-weight:800;
  box-shadow:var(--shadow-s); transition:.15s; white-space:nowrap;
}
.chip .e{font-size:13px; line-height:1;}
.chip .n{font-size:11px; opacity:.62; font-weight:800;}
.chip.on{color:#fff; border-color:transparent;}
.chip.on .n{opacity:.85;}
.coursebar{
  flex:0 0 auto; display:flex; gap:6px; padding:6px 14px 8px;
  overflow-x:auto; scrollbar-width:none;
}
.coursebar::-webkit-scrollbar{display:none;}
.cchip{
  flex:0 0 auto; display:flex; align-items:center; gap:5px;
  background:linear-gradient(150deg,#FFF1E0,#FFE7CC);
  border:1.5px dashed #EFC79A; color:#8A4A18;
  border-radius:12px; padding:6px 11px; font-size:12px; font-weight:800; white-space:nowrap;
}
.cchip.on{background:linear-gradient(150deg,#3B2E24,#5B4433); border-color:#3B2E24; border-style:solid; color:#FFE9C9;}

/* ---------- map / list ---------- */
.main{flex:1 1 auto; min-height:0; position:relative; background:var(--cream2);}
#map{position:absolute; inset:0; z-index:1; background:#EFE6D8;}
.mapfail{
  position:absolute; inset:0; display:grid; place-items:center; text-align:center;
  padding:30px; font-size:13.5px; color:var(--ink2); font-weight:700; line-height:1.6;
}
.leaflet-container{font-family:inherit;}
.leaflet-control-attribution{font-size:9.5px !important; background:rgba(255,255,255,.82) !important;}
.leaflet-control-zoom{border:0 !important; box-shadow:var(--shadow-s) !important; border-radius:12px !important; overflow:hidden;}
.leaflet-control-zoom a{background:#fff !important; color:var(--ink) !important; border-color:var(--line) !important; width:34px !important; height:34px !important; line-height:32px !important; font-size:18px !important;}
.leaflet-bottom.leaflet-right{margin-bottom:calc(6px + var(--safe-b));}

/* pin */
.pin{
  width:34px; height:34px; border-radius:50%; background:var(--c,#666);
  border:2.5px solid #fff; display:grid; place-items:center; position:relative;
  box-shadow:0 4px 10px rgba(0,0,0,.28); font-size:16px; line-height:1;
  transition:transform .12s;
}
.pin .num{
  position:absolute; top:-7px; right:-7px; width:17px; height:17px; border-radius:999px;
  background:#2A211A; color:#fff; font-size:10.5px; font-weight:800;
  display:grid; place-items:center; border:1.5px solid #fff;
}
.pin.sel{transform:scale(1.22); box-shadow:0 6px 16px rgba(0,0,0,.36); z-index:999;}
.pin.dim{opacity:.26; filter:grayscale(.55);}
.pin.sel .num{background:var(--brand);}
.leaflet-marker-icon:focus{outline:none;}

/* my location */
.locate{
  position:absolute; right:12px; bottom:calc(28px + var(--safe-b)); z-index:20;
  width:44px; height:44px; border-radius:50%; background:#fff;
  border:1.5px solid var(--line2); box-shadow:var(--shadow);
  display:grid; place-items:center; font-size:19px;
}
.locate:active{transform:scale(.94);}
.locate.busy{opacity:.5;}
body.course .locate{bottom:calc(96px + var(--safe-b));}
.leaflet-top.leaflet-right{margin-top:8px; margin-right:6px;}

/* course banner */
.cbanner{
  position:absolute; left:12px; right:12px; bottom:calc(28px + var(--safe-b)); z-index:21;
  background:linear-gradient(150deg,#3B2E24,#5B4433); color:#FFE9C9;
  border-radius:16px; padding:10px 12px; box-shadow:0 10px 26px rgba(0,0,0,.28);
  display:flex; align-items:center; gap:10px;
}
.cbanner .t{flex:1 1 auto; min-width:0;}
.cbanner b{display:block; font-size:13px; letter-spacing:-.3px;}
.cbanner span{display:block; font-size:11px; opacity:.78; margin-top:1px;}
.cbanner .go{
  flex:0 0 auto; background:#FFE1B8; color:#5B3A16; border-radius:999px;
  padding:7px 12px; font-size:12px; font-weight:800;
}

/* list */
#list{
  position:absolute; inset:0; z-index:2; overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:var(--cream); padding-bottom:calc(20px + var(--safe-b));
}
.lwrap{padding:10px 14px 0;}
.lhead{
  display:flex; align-items:baseline; gap:8px; margin:14px 2px 8px;
}
.lhead .le{font-size:15px;}
.lhead h2{font-size:13.5px; margin:0; font-weight:800; letter-spacing:-.3px;}
.lhead .lc{font-size:11px; color:var(--ink3); font-weight:800; margin-left:auto;}
.item{
  display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left;
  background:var(--card); border:1.5px solid var(--line); border-radius:16px;
  padding:11px 12px; margin-bottom:8px; box-shadow:var(--shadow-s);
  border-bottom-width:3px; transition:transform .08s;
}
.item:active{transform:scale(.985);}
.item .ico{
  flex:0 0 auto; width:36px; height:36px; border-radius:12px; display:grid; place-items:center;
  font-size:18px; background:var(--c); color:#fff;
}
.item .body{min-width:0; flex:1 1 auto;}
.item h3{margin:0; font-size:14px; font-weight:800; letter-spacing:-.35px; display:flex; align-items:center; gap:5px;}
.item h3 .num{
  background:#2A211A; color:#fff; font-size:9.5px; font-weight:800;
  border-radius:999px; width:15px; height:15px; display:grid; place-items:center; flex:0 0 auto;
}
.item p{margin:2px 0 0; font-size:11.8px; color:var(--ink2); font-weight:600; line-height:1.45;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.item .meta{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;}
.tag{
  font-size:10.5px; font-weight:800; border-radius:7px; padding:2px 6px;
  background:#FFF3E5; color:#8A5B2A; border:1px solid #F5E0C8;
}
.tag.warn{background:#FFEDE9; color:#B93A20; border-color:#F8D3C9;}
.tag.open{background:#E9F7EF; color:#1E7A4D; border-color:#C9EBD8;}
.note{font-size:10.8px; color:var(--ink3); font-weight:700; text-align:center; padding:14px 20px 0; line-height:1.6;}

/* ---------- bottom sheet ---------- */
.backdrop{
  position:fixed; inset:0; background:rgba(40,28,18,.34); z-index:60;
  opacity:0; pointer-events:none; transition:opacity .22s;
}
.backdrop.on{opacity:1; pointer-events:auto;}
sheet{display:block;}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:70;
  max-width:820px; margin:0 auto;
  background:var(--card); border-radius:22px 22px 0 0;
  box-shadow:0 -12px 34px rgba(60,40,20,.22);
  transform:translateY(104%); transition:transform .27s cubic-bezier(.22,.8,.3,1);
  max-height:86vh; max-height:86dvh; display:flex; flex-direction:column;
  padding-bottom:var(--safe-b);
}
.sheet.on{transform:translateY(0);}
.grab{flex:0 0 auto; padding:9px 0 3px; display:grid; place-items:center;}
.grab i{display:block; width:40px; height:4px; border-radius:999px; background:var(--line2);}
.sh-scroll{overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;}
.sh-head{display:flex; gap:11px; padding:4px 16px 10px; align-items:flex-start;}
.sh-ico{
  width:46px; height:46px; flex:0 0 auto; border-radius:15px; display:grid; place-items:center;
  font-size:23px; background:var(--c); color:#fff; box-shadow:var(--shadow-s);
}
.sh-title{min-width:0; flex:1 1 auto; padding-right:30px;}
.sh-title h2{margin:0; font-size:18.5px; letter-spacing:-.7px; font-weight:800; line-height:1.25;}
.sh-title .sum{margin:3px 0 0; font-size:12.5px; color:var(--ink2); font-weight:600; line-height:1.5;}
.sh-close{
  position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%;
  background:var(--cream2); display:grid; place-items:center; font-size:15px; color:var(--ink2); font-weight:800;
}
.sh-body{padding:0 16px 16px;}
.sect{margin-top:13px;}
.sect h4{
  margin:0 0 6px; font-size:11px; font-weight:800; letter-spacing:.4px; color:var(--ink3);
  text-transform:uppercase;
}
.kv{display:flex; gap:8px; align-items:flex-start; font-size:13px; font-weight:600; margin-bottom:5px;}
.kv .k{flex:0 0 auto; width:44px; color:var(--ink3); font-size:11.5px; font-weight:800; padding-top:2px;}
.kv .v{flex:1 1 auto; min-width:0; word-break:keep-all;}
.kv .v b{font-weight:800;}
.kv .v .sub{display:block; font-size:11px; color:var(--ink3); font-weight:700; margin-top:2px;}
.hoursline{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.pill{font-size:11px; font-weight:800; border-radius:8px; padding:2px 7px;}
.pill.closed{background:#FFEDE9; color:#B93A20;}
.pill.unk{background:#F1EDE6; color:#8A7A67;}
.menu{list-style:none; margin:0; padding:0; border:1.5px solid var(--line); border-radius:14px; overflow:hidden; background:#FFFCF6;}
.menu li{display:flex; gap:10px; padding:8px 11px; font-size:13px; border-bottom:1px solid #F6EBDC;}
.menu li:last-child{border-bottom:0;}
.menu li span{flex:1 1 auto; font-weight:600;}
.menu li b{flex:0 0 auto; font-weight:800; color:#8A4A18; font-variant-numeric:tabular-nums;}
.tips{list-style:none; margin:0; padding:0;}
.tips li{
  position:relative; padding:0 0 0 17px; margin-bottom:6px; font-size:12.6px;
  color:#5A4B3C; font-weight:600; line-height:1.5;
}
.tips li::before{
  content:"•"; position:absolute; left:4px; top:-1px; color:var(--brand); font-weight:900; font-size:15px;
}
.acts{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:15px;}
.acts a{
  display:flex; flex-direction:column; align-items:center; gap:3px; justify-content:center;
  border-radius:13px; padding:10px 4px; font-size:11.5px; font-weight:800; line-height:1.15;
  border:1.5px solid var(--line2); background:#fff; box-shadow:var(--shadow-s);
}
.acts a .ai{font-size:17px; line-height:1;}
.acts a:active{transform:scale(.96);}
.acts .kakao{background:#FEE500; border-color:#F2DA00; color:#3A1D1D;}
.acts .naver{background:#03C75A; border-color:#03B151; color:#fff;}
.acts .google{background:#fff; border-color:#E2D6C6; color:#3B6FD4;}
.callrow{display:flex; gap:7px; margin-top:8px;}
.callrow a{
  flex:1 1 auto; text-align:center; border-radius:12px; padding:9px; font-size:12.5px; font-weight:800;
  border:1.5px solid var(--line2); background:#FFF9F0; color:var(--ink2);
}
.stamp{font-size:10.5px; color:var(--ink3); font-weight:700; margin-top:14px; line-height:1.6; text-align:center;}

/* course sheet */
.cstep{
  display:flex; gap:10px; align-items:flex-start; background:#FFFCF6;
  border:1.5px solid var(--line); border-radius:14px; padding:10px 11px; margin-bottom:7px;
  width:100%; text-align:left;
}
.cstep .no{
  flex:0 0 auto; width:22px; height:22px; border-radius:999px; background:#2A211A; color:#fff;
  display:grid; place-items:center; font-size:11.5px; font-weight:800;
}
.cstep .cbody{flex:1 1 auto; min-width:0;}
.cstep b{font-size:13.5px; font-weight:800; display:block; letter-spacing:-.3px;}
.cstep span{font-size:11.8px; color:var(--ink2); font-weight:600; display:block; margin-top:1px; line-height:1.45;}
.cstep .dist{font-size:10.5px; color:var(--ink3); font-weight:800; margin-top:3px; display:block;}

/* toast */
.toast{
  position:fixed; left:50%; bottom:calc(20px + var(--safe-b)); transform:translate(-50%,20px);
  background:rgba(43,32,24,.94); color:#fff; font-size:12.5px; font-weight:700;
  padding:9px 15px; border-radius:999px; z-index:120; opacity:0; pointer-events:none;
  transition:.22s; max-width:86vw; text-align:center;
}
.toast.on{opacity:1; transform:translate(-50%,0);}

body.locked{overflow:hidden;}
@media (min-width:640px){
  .sheet{max-height:78vh;}
  h1{font-size:19px;}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="hrow">
      <div class="hlogo">🍙</div>
      <div class="hd">
        <h1>안양중앙시장 맛집 지도</h1>
        <p class="hsub">김밥·떡볶이·칼국수·곱창·닭강정 + 주차까지</p>
      </div>
      <div class="seg" role="tablist" aria-label="보기 전환">
        <button id="btnMap" class="on" role="tab" aria-selected="true">🗺 지도</button>
        <button id="btnList" role="tab" aria-selected="false">☰ 리스트</button>
      </div>
    </div>
  </header>

  <div class="chips" id="chips" role="tablist" aria-label="카테고리"></div>
  <div class="coursebar" id="coursebar" aria-label="추천 코스"></div>

  <div class="main">
    <div id="map" role="application" aria-label="안양중앙시장 맛집 지도"></div>
    <button class="locate" id="locate" aria-label="내 위치로 이동">📍</button>
    <div class="cbanner" id="cbanner" hidden>
      <div class="t"><b id="cbTitle"></b><span id="cbSub"></span></div>
      <button class="go" id="cbGo">코스 보기</button>
    </div>

    <div id="list" hidden></div>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<sheet>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <div class="grab"><i></i></div>
    <button class="sh-close" id="shClose" aria-label="닫기">✕</button>
    <div class="sh-scroll" id="shScroll"></div>
  </div>
</sheet>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   안양중앙시장 맛집 데이터
   모든 좌표는 지도 서비스(카카오맵·구글맵) 실측 좌표,
   영업시간·가격은 공식/현장 방문 자료를 2026-11-28에 대조한 값.
   바뀔 수 있는 값은 카드에 "현장 확인" 표기를 함께 남김.
   ========================================================= */
const CATS = {
  all:   { label:'전체',           emoji:'🍽', color:'#3B2E24' },
  gimbap:{ label:'김밥·만두',      emoji:'🍙', color:'#1E9E6A' },
  tteok: { label:'떡볶이',         emoji:'🌶', color:'#E2452F' },
  meal:  { label:'식사·곱창',      emoji:'🍜', color:'#D0801F' },
  snack: { label:'간식·닭강정',    emoji:'🍗', color:'#9452C4' },
  park:  { label:'주차',           emoji:'🅿️', color:'#2F6FE0' }
};

const PLACES = [
  {
    id:'somunnan', cat:'gimbap', name:'소문난김밥집', emoji:'🍙',
    lat:37.397365, lng:126.9204747,
    addr:'경기 안양시 만안구 냉천로 190-15 1층', jibun:'안양동 676-191',
    phone:'0507-1326-0244',
    hours:'화~일 08:00~18:30', hoursNote:'자료에 따라 05:00 오픈으로 적힌 곳도 있음',
    closed:'월요일',
    summary:'야채김밥 2,000원부터. 안양 토박이가 줄 서는 가격 그대로의 김밥집.',
    menu:[['야채김밥','2,000'],['치즈김밥','3,000'],['참치김밥','3,000'],['참치땡초김밥','3,000'],['멸치김밥','3,500'],['멸치땡초김밥','3,500']],
    tips:[
      '매주 월요일 정기휴무 — 월요일에 헛걸음하지 않기',
      '순대곱창골목 입구, 시장 쉼터 맞은편이라 곱창 먹기 전후로 들르기 좋아요',
      '비아김밥보다 줄이 짧아 급할 때 대안으로 딱',
      '참치땡초는 청양고추가 두 개 들어가 제법 매콤해요',
      '안양사랑페이(지역화폐) 가맹점'
    ]
  },
  {
    id:'bia', cat:'gimbap', name:'비아김밥 (중앙점)', emoji:'🍙',
    lat:37.39662, lng:126.9198695,
    addr:'경기 안양시 만안구 냉천로 187 1층', jibun:'안양동 676-251 (본점 기준)',

/* ===================== helpers ===================== */
function dist(a,b){
  const R=6371000, toR=Math.PI/180;
  const dLat=(b.lat-a.lat)*toR, dLng=(b.lng-a.lng)*toR;
  const s=Math.sin(dLat/2)**2 + Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLng/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(s)));
}
function links(p){
  const n=encodeURIComponent(p.name);
  return {
    kakao:`https://map.kakao.com/link/to/${n},${p.lat},${p.lng}`,
    naver:`https://map.naver.com/p/search/${encodeURIComponent(p.name+' 안양중앙시장')}`,
    google:`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=walking&dir_action=navigate`
  };
}
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('on'),2200);
}
function courseIndexOf(id){
  if(!activeCourse) return 0;
  const i=activeCourse.stops.findIndex(s=>s.id===id);
  return i<0?0:i+1;
}

/* ===================== chips ===================== */
function renderChips(){
  const box=$('#chips'); box.innerHTML='';
  Object.entries(CATS).forEach(([key,c])=>{
    const count = key==='all' ? PLACES.length : PLACES.filter(p=>p.cat===key).length;
    const b=document.createElement('button');
    b.className='chip'+(activeCat===key?' on':'');
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected', activeCat===key?'true':'false');
    if(activeCat===key) b.style.background=c.color;
    b.innerHTML=`<span class="e">${c.emoji}</span>${c.label}<span class="n">${count}</span>`;
    b.onclick=()=>{
      activeCat = key;
      if(activeCourse){ activeCourse=null; renderCourses(); $('#cbanner').hidden=true; }
      renderChips(); renderMarkers(); renderList(); fitVisible();
    };
    box.appendChild(b);
  });
}

function renderCourses(){
  const box=$('#coursebar'); box.innerHTML='';
  COURSES.forEach(c=>{
    const b=document.createElement('button');
    b.className='cchip'+(activeCourse && activeCourse.id===c.id?' on':'');
    b.innerHTML=`<span>${c.emoji}</span>${c.short}`;
    b.onclick=()=>toggleCourse(c);
    box.appendChild(b);
  });
}

function toggleCourse(c){
  if(activeCourse && activeCourse.id===c.id){
    activeCourse=null;
    $('#cbanner').hidden=true;
    renderCourses(); renderMarkers(); renderList(); fitVisible();
    return;
  }
  activeCourse=c;
  activeCat='all';
  renderChips(); renderCourses(); renderMarkers(); renderList();
  showCourseBanner();
  if(view==='map') fitCourse();
  openCourseSheet(c);
}

function showCourseBanner(){
  if(!activeCourse){ $('#cbanner').hidden=true; document.body.classList.remove('course'); return; }
  $('#cbTitle').textContent=`${activeCourse.emoji} ${activeCourse.title}`;
  $('#cbSub').textContent=activeCourse.stops.length+'곳 · 탭하면 코스 순서 보기';
  const show = (view==='map');
  $('#cbanner').hidden = !show;
  document.body.classList.toggle('course', show);
}

/* ===================== map ===================== */
function pinIcon(p, opts={}){
  const color = CATS[p.cat].color;
  const num = opts.num ? `<b class="num">${opts.num}</b>` : '';
  const cls = 'pin'+(opts.sel?' sel':'')+(opts.dim?' dim':'');
  return L.divIcon({
    className:'',
    html:`<div class="${cls}" style="--c:${color}"><span>${p.emoji}</span>${num}</div>`,
    iconSize:[34,34], iconAnchor:[17,17], popupAnchor:[0,-18]
  });
}

function buildMap(){
  map = L.map('map', {
    zoomControl:false, attributionControl:false,
    minZoom:14, maxZoom:19, zoomSnap:0.5, tap:true
  }).setView([37.3975,126.9203], 17);

  L.control.attribution({position:'bottomleft', prefix:false}).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19,
    attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);

  L.control.zoom({position:'topright'}).addTo(map);
  layer = L.layerGroup().addTo(map);

  PLACES.forEach(p=>{
    const m=L.marker([p.lat,p.lng], {icon:pinIcon(p), keyboard:true, title:p.name, riseOnHover:true});
    m.on('click', ()=>openPlace(p.id, true));
    markers[p.id]=m;
  });
  renderMarkers();
  setTimeout(()=>map.invalidateSize(), 120);
}

function visibleSet(){
  if(activeCourse) return new Set(activeCourse.stops.map(s=>s.id));
  if(activeCat==='all') return new Set(PLACES.map(p=>p.id));
  return new Set(PLACES.filter(p=>p.cat===activeCat).map(p=>p.id));
}

function renderMarkers(){
  if(!map) return;
  layer.clearLayers();
  const vis=visibleSet();
  PLACES.forEach(p=>{
    if(!vis.has(p.id)) return;
    const m=markers[p.id];
    const num = activeCourse ? courseIndexOf(p.id) : 0;
    const dim = activeCourse && num===0;
    m.setIcon(pinIcon(p,{num:num||null, dim, sel:selectedId===p.id}));
    m.addTo(layer);
  });
}

function fitVisible(){
  if(!map) return;
  const vis=[...visibleSet()].map(byId).filter(Boolean);
  if(!vis.length) return;
  if(vis.length===1){ map.setView([vis[0].lat,vis[0].lng], 18, {animate:true}); return; }
  const b=L.latLngBounds(vis.map(p=>[p.lat,p.lng]));
  map.fitBounds(b, {paddingTopLeft:[30,20], paddingBottomRight:[30,60], maxZoom:18, animate:true});
}
function fitCourse(){ fitVisible(); }

/* ===================== geolocation ===================== */
function locate(){
  if(!navigator.geolocation){ toast('이 브라우저에서는 위치를 쓸 수 없어요'); return; }
  const b=$('#locate'); b.classList.add('busy');
  navigator.geolocation.getCurrentPosition(
    pos=>{
      b.classList.remove('busy');
      const ll=[pos.coords.latitude,pos.coords.longitude];
      if(!map) return;
      L.circleMarker(ll,{radius:7,color:'#fff',weight:3,fillColor:'#2F6FE0',fillOpacity:1}).addTo(map).bindPopup('지금 여기');
      map.setView(ll, 17, {animate:true});
      const d=dist({lat:ll[0],lng:ll[1]}, {lat:37.3976,lng:126.9196});
      toast(`시장까지 직선 약 ${d>=1000?(d/1000).toFixed(1)+'km':d+'m'}`);
    },
    err=>{ b.classList.remove('busy'); toast('위치를 가져오지 못했어요 (권한을 확인해 주세요)'); },
    {enableHighAccuracy:true, timeout:9000, maximumAge:60000}
  );
}

/* ===================== boot ===================== */
function bootMap(){
  try{
    buildMap();
  }catch(e){
    console.error(e);
    $('#map').innerHTML='<div class="mapfail">지도를 불러오지 못했어요.<br>리스트 보기로도 모든 맛집을 볼 수 있어요.</div>';
  }
}

function ensureLeaflet(cb){
  if(window.L) return cb();
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';
  s.onload=cb;
  s.onerror=()=>{
    $('#map').innerHTML='<div class="mapfail">지도를 불러오지 못했어요.<br>인터넷 연결을 확인하거나 리스트 보기를 이용해 주세요.</div>';
  };
  document.head.appendChild(s);
}

document.addEventListener('DOMContentLoaded', ()=>{
  renderChips(); renderCourses(); renderList();

  $('#btnMap').onclick=()=>setView('map');
  $('#btnList').onclick=()=>setView('list');
  $('#shClose').onclick=closeSheet;
  $('#backdrop').onclick=closeSheet;
  $('#locate').onclick=locate;
  $('#cbGo').onclick=()=>{ if(activeCourse) openCourseSheet(activeCourse); };
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && sheetOpen) closeSheet(); });

  // swipe-down on the grab handle closes the sheet
  let sy=null;
  $('#sheet').addEventListener('touchstart', e=>{
    const g=e.target.closest('.grab');
    if(g) sy=e.touches[0].clientY;
  }, {passive:true});
  $('#sheet').addEventListener('touchmove', e=>{
    if(sy==null) return;
    const dy=e.touches[0].clientY-sy;
    if(dy>70){ sy=null; closeSheet(); }
  }, {passive:true});

  ensureLeaflet(bootMap);

  // hash deep link (#p=bia)
  const m=location.hash.match(/p=([a-z0-9]+)/i);
  if(m && byId(m[1])) setTimeout(()=>openPlace(m[1], false), 500);
});
</script>
