<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>윤서의 한글 공부방</title>
<meta name="theme-color" content="#FFF6EC">
<meta name="description" content="한 획씩 바르게! 윤서의 한글 쓰기 놀이터">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="윤서 한글방">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  --cream:#FFF6EC; --cream2:#FFEEDF; --card:#FFFDFA;
  --ink:#4A3B31; --ink2:#8E7969; --line:#F3E3D3;
  --pink:#FF7FA3; --pink-d:#F2608A; --pink-l:#FFE6EE; --mint:#7CD2B2; --yellow:#FFD264;
  --shadow:0 8px 22px rgba(180,120,80,.10);
  --shadow-s:0 3px 10px rgba(180,120,80,.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
[hidden]{display:none !important;}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  background:radial-gradient(900px 500px at 15% -10%,#FFFCF6 0%,rgba(255,252,246,0) 60%),var(--cream);
  color:var(--ink); -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-text-size-adjust:100%; line-height:1.45;
}
button{font-family:inherit; cursor:pointer;}
.app{display:flex; flex-direction:column; height:100vh; height:100dvh; max-width:900px; margin:0 auto;}
header.top{display:flex; align-items:center; gap:10px; padding:calc(8px + env(safe-area-inset-top)) 16px 4px; flex:0 0 auto;}
.avatar{width:46px; height:46px; border-radius:50%; object-fit:cover; object-position:50% 22%; border:2px solid #fff; box-shadow:var(--shadow-s); background:var(--cream2);}
.hd{min-width:0;}
h1{font-size:17.5px; margin:0; letter-spacing:-.5px; font-weight:800;}
.sub{margin:0; font-size:11.5px; color:var(--ink2);}
.stars{margin-left:auto; display:flex; align-items:center; gap:5px; background:#fff; border:1.5px solid var(--line); border-radius:999px; padding:6px 12px; font-weight:800; font-size:14px; box-shadow:var(--shadow-s);}
.stars b{color:var(--pink-d);}
.mbtn{display:flex; align-items:center; justify-content:center; gap:4px; flex:0 0 auto; border:1.5px solid #FFC9DA; background:linear-gradient(150deg,#FFF1F6,#FFF9EE); color:var(--pink-d); border-radius:999px; padding:6px 10px; font-size:11.5px; font-weight:800; line-height:1; box-shadow:var(--shadow-s); transition:transform .08s, background .2s, border-color .2s;}
.mbtn:active{transform:scale(.95);}
.mbtn .mi{font-size:14px; display:block; line-height:1;}
.mbtn.off{background:#fff; border-color:var(--line); color:#B6A395; box-shadow:none;}
.mbtn.off .mi{opacity:.55; filter:grayscale(1);}
.tabs{display:flex; gap:6px; padding:8px 12px 2px; overflow-x:auto; flex:0 0 auto; scrollbar-width:none;}.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto; border:1.5px solid var(--line); background:#fff; color:var(--ink2); border-radius:999px; padding:7px 13px; font-size:13px; font-weight:800; transition:.15s;}
.tab.on{background:var(--pink); border-color:var(--pink); color:#fff; box-shadow:0 4px 12px rgba(255,127,163,.32);}
.main{flex:1 1 auto; min-height:0; position:relative;}
.view{position:absolute; inset:0; display:flex; flex-direction:column; min-height:0;}
.scroll{flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:10px; padding:10px 14px calc(28px + env(safe-area-inset-bottom));}
.card{position:relative; background:var(--card); border:1.5px solid var(--line); border-radius:20px; padding:12px 6px 9px; text-align:center; box-shadow:var(--shadow-s); transition:transform .08s; border-bottom-width:3px;}
.card:active{transform:scale(.96);}
.card .g{font-size:33px; font-weight:800; line-height:1.12; letter-spacing:-1px; color:#5B4638;}
.card .e{font-size:16px; line-height:1; margin-top:3px; height:18px;}
.card .n{font-size:10.5px; color:var(--ink2); margin-top:3px; font-weight:700;}
.card .b{position:absolute; top:5px; right:8px; font-size:10.5px; font-weight:800; color:var(--pink-d);}
.sec-title{padding:14px 18px 2px; font-size:12.5px; font-weight:800; color:var(--ink2); letter-spacing:-.2px;}

/* write view */
.wt{display:flex; align-items:center; gap:8px; padding:6px 12px 2px; flex:0 0 auto;}
.iconbtn{border:none; background:#fff; border:1.5px solid var(--line); width:38px; height:38px; border-radius:14px; font-size:17px; line-height:1; box-shadow:var(--shadow-s); color:var(--ink); flex:0 0 auto;}
.wt-title{flex:1 1 auto; min-width:0; text-align:center;}
.wt-title .big{font-size:22px; font-weight:800; letter-spacing:-1px;}
.wt-title .small{display:block; font-size:10.5px; color:var(--ink2); font-weight:700; letter-spacing:.2px;}
.stage{flex:1 1 auto; min-height:0; position:relative; display:grid; place-items:center; padding:6px 10px 2px;}
canvas#pad{display:block; background:#FFFDFA; border-radius:26px; box-shadow:var(--shadow); touch-action:none; -webkit-user-select:none; user-select:none;}
.bubble{position:absolute; left:50%; bottom:6px; transform:translateX(-50%) translateY(10px); background:#fff; border:2px solid var(--pink-l); color:var(--pink-d); font-weight:800; font-size:13.5px; padding:9px 16px; border-radius:999px; box-shadow:var(--shadow); opacity:0; transition:opacity .22s, transform .22s; pointer-events:none; max-width:94%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.bubble.show{opacity:1; transform:translateX(-50%) translateY(0);}
.tools{display:flex; gap:7px; padding:6px 12px 2px; flex:0 0 auto;}
.tools button{flex:1 1 0; border:1.5px solid var(--line); background:#fff; border-radius:15px; padding:10px 4px; font-size:12.5px; font-weight:800; color:var(--ink); box-shadow:var(--shadow-s); transition:transform .08s; white-space:nowrap;}
.tools button:active{transform:scale(.96);}
.tools button.on{background:var(--pink-l); border-color:#FFC9DA; color:var(--pink-d);}
.navrow{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 12px calc(8px + env(safe-area-inset-bottom)); flex:0 0 auto;}
.navrow button{border:1.5px solid var(--line); background:#fff; border-radius:13px; padding:8px 14px; font-size:12.5px; font-weight:800; color:var(--ink); box-shadow:var(--shadow-s);}
.navrow button:disabled{opacity:.35;}
.navrow .prog{font-size:12px; font-weight:800; color:var(--ink2);}

/* 요약 바 */
.summary{display:flex; align-items:center; gap:6px; padding:6px 14px 0; flex:0 0 auto; overflow:hidden;}
.chip{flex:0 0 auto; background:#fff; border:1.5px solid var(--line); border-radius:999px; padding:4px 10px; font-size:11.5px; font-weight:800; color:var(--ink2); box-shadow:var(--shadow-s);}
.chip b{color:var(--pink-d); font-size:12.5px;}
.todayline{flex:1 1 auto; min-width:0; font-size:11px; color:var(--ink2); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:2px;}

/* 출석 도장판 */
.today-chips{display:flex; flex-wrap:wrap; gap:6px; padding:6px 14px 0;}
.tchip{background:#FFF1F6; border:1.5px solid #FFDDE9; color:var(--pink-d); border-radius:999px; padding:5px 11px; font-size:13.5px; font-weight:800;}
.tempty{font-size:12px; color:var(--ink2); font-weight:700; padding:4px 2px;}
.cal-head{display:flex; align-items:center; justify-content:space-between; padding:12px 16px 6px;}
.cal-head .t{font-size:14px; font-weight:800; color:var(--ink);}
.cal-head button{border:1.5px solid var(--line); background:#fff; border-radius:11px; width:34px; height:34px; font-size:12px; font-weight:800; color:var(--ink); box-shadow:var(--shadow-s);}
.cal-head button:disabled{opacity:.28;}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; padding:0 12px;}
.cal .dow{text-align:center; font-size:10.5px; font-weight:800; color:var(--ink2); padding:2px 0 3px;}
.cal .dow.sun{color:#E9836F;}
.cal .cell{height:58px; border-radius:14px; background:#fff; border:1.5px solid var(--line); position:relative; display:flex; align-items:center; justify-content:center;}
.cal .cell.off{background:transparent; border-color:transparent;}
.cal .dn{position:absolute; top:3px; left:6px; font-size:9.5px; font-weight:800; color:var(--ink2);}
.cal .cell.today{border-color:var(--pink); box-shadow:0 0 0 3px var(--pink-l);}
.cal .cell.today .dn{color:var(--pink-d);}
.cal .stamp{width:42px; height:42px; border-radius:50%; object-fit:cover; object-position:50% 16%; border:2.5px solid #FFD3E0; transform:rotate(-7deg); box-shadow:0 3px 8px rgba(255,127,163,.26); margin-top:7px;}
.stats{display:flex; gap:8px; padding:14px 14px 2px;}
.stat{flex:1 1 0; background:#fff; border:1.5px solid var(--line); border-radius:16px; padding:10px 4px; text-align:center; box-shadow:var(--shadow-s);}
.stat .k{font-size:10.5px; color:var(--ink2); font-weight:800; white-space:nowrap;}
.stat .v{font-size:17px; font-weight:800; color:var(--pink-d);}

/* sticker book */
.sb-head{display:flex; align-items:center; gap:12px; margin:12px 14px 4px; padding:16px; background:linear-gradient(150deg,#FFF3F7,#FFF9EE); border:1.5px solid #FFE1EA; border-radius:22px; box-shadow:var(--shadow-s);}
.sb-head .big{font-size:30px;}
.sb-head .t{font-size:12px; color:var(--ink2); font-weight:700;}
.sb-head .v{font-size:20px; font-weight:800; color:var(--pink-d);}
.empty{padding:40px 24px; text-align:center; color:var(--ink2); font-size:13.5px; font-weight:700; line-height:1.7;}

/* cheer */
#cheer{position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; background:rgba(255,246,236,.94); -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px); padding:20px; text-align:center;}
#cheer img{width:min(64vw,300px); max-height:46vh; object-fit:contain; border-radius:28px; background:#FFF3E4; animation:pop .5s cubic-bezier(.2,1.5,.4,1);}
@keyframes pop{0%{transform:scale(.7); opacity:0;} 100%{transform:scale(1); opacity:1;}}
#cheer .msg{font-size:23px; font-weight:900; color:var(--pink-d); letter-spacing:-.6px; animation:pop .55s .1s backwards cubic-bezier(.2,1.5,.4,1);}
#cheer .plus{font-size:16px; font-weight:800; color:var(--ink); animation:pop .55s .2s backwards cubic-bezier(.2,1.5,.4,1);}
#cheer .btns{display:flex; gap:9px; margin-top:8px;}
#cheer .btns button{border:none; border-radius:999px; padding:12px 20px; font-size:14px; font-weight:800; box-shadow:var(--shadow);}
#cheer .btns .a{background:#fff; color:var(--ink); border:1.5px solid var(--line);}
#cheer .btns .b{background:var(--pink); color:#fff;}
.cf{position:absolute; font-size:22px; animation:fall 1.9s linear forwards; pointer-events:none;}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0); opacity:1;} 100%{transform:translateY(95vh) rotate(320deg); opacity:0;}}
@media (max-height:560px){ .tools button{font-size:11.5px; padding:8px 2px;} .card .g{font-size:28px;} }
@media (max-width:430px){ .mbtn .mt{display:none;} .mbtn{padding:7px 8px; border-radius:14px;} header.top{gap:8px;} }
@media (max-width:420px){ .tools{gap:5px; padding:6px 8px 2px;} .tools button{font-size:11px; padding:9px 2px;} .navrow{padding:6px 8px calc(8px + env(safe-area-inset-bottom));} .wt-title .big{font-size:19px;} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <img class="avatar" src="img/yoonseo-char.jpg" alt="윤서">
    <div class="hd">
      <h1>윤서의 한글 공부방</h1>
      <p class="sub">한 획씩, 바르게 써 볼까요?</p>
    </div>
    <button class="mbtn" id="btnMusic" aria-pressed="true" aria-label="배경음악 켜기·끄기" title="배경음악">
      <span class="mi">🎵</span><span class="mt">배경음</span>
    </button>
    <div class="stars" title="모은 별">⭐ <b id="starTotal">0</b></div>
  </header>

  <div class="summary" id="summary">
    <span class="chip">📅 오늘 <b id="sumToday">0</b>글자</span>
    <span class="chip">🔥 연속 <b id="sumStreak">0</b>일</span>
    <span class="todayline" id="sumChars">오늘 쓴 글자: 아직 없어요</span>
  </div>

  <nav class="tabs" id="tabs"></nav>

  <main class="main">
    <!-- 목록 -->
    <section class="view" id="viewList">
      <div class="scroll">
        <div class="grid" id="cardGrid"></div>
      </div>
    </section>

    <!-- 쓰기 -->
    <section class="view" id="viewWrite" hidden>
      <div class="wt">
        <button class="iconbtn" id="btnBack" aria-label="목록으로">←</button>
        <div class="wt-title"><span class="big" id="wLetter">강</span><span class="small" id="wParts">ㄱ · ㅏ · ㅇ</span></div>
        <button class="iconbtn" id="btnSay2" aria-label="소리 듣기">🔊</button>
      </div>
      <div class="stage" id="stage">
        <canvas id="pad"></canvas>
        <div class="bubble" id="bubble"></div>
      </div>
      <div class="tools">
        <button id="btnShow">👀 획순 보기</button>
        <button id="btnReset">🔄 다시 쓰기</button>
        <button id="btnGuide" class="on">4분할 선</button>
      </div>
      <div class="navrow">
        <button id="btnPrev">◀ 이전</button>
        <span class="prog" id="wProg">1 / 6 획</span>
        <button id="btnNext">다음 ▶</button>
      </div>
    </section>

    <!-- 출석·스티커 -->
    <section class="view" id="viewStar" hidden>
      <div class="scroll">
        <div class="sb-head">
          <div class="big" id="sbEmoji">📅</div>
          <div><div class="t">오늘 공부한 글자</div><div class="v"><span id="sbToday">0</span> 글자</div></div>
          <div class="big" style="margin-left:auto">🎀</div>
        </div>
        <div class="today-chips" id="todayChips"></div>

        <div class="cal-head">
          <button id="calPrev" aria-label="이전 달">◀</button>
          <div class="t" id="calTitle">2026년 11월</div>
          <button id="calNext" aria-label="다음 달">▶</button>
        </div>
        <div class="cal" id="cal"></div>

        <div class="stats">
          <div class="stat"><div class="k">🔥 연속 출석</div><div class="v"><span id="stStreak">0</span>일</div></div>
          <div class="stat"><div class="k">🎯 총 출석</div><div class="v"><span id="stDays">0</span>일</div></div>
          <div class="stat"><div class="k">⭐ 모은 별</div><div class="v"><span id="sbTotal">0</span>개</div></div>
        </div>

        <div class="sec-title">🌈 내가 쓴 글자 도감</div>
        <div class="grid" id="starGrid"></div>
        <div class="empty" id="starEmpty">아직 스티커가 없어요.<br>글자를 하나 완성하면 별이 쌓여요!</div>
      </div>
    </section>
  </main>
</div>

<div id="cheer" hidden>
  <img src="img/yoonseo-cheer.jpg" alt="축하해요">
  <div class="msg" id="cheerMsg">정말 잘했어요!</div>
  <div class="plus" id="cheerPlus">⭐ 별 스티커 +1</div>
  <div class="btns">
    <button class="a" id="cheerAgain">또 쓸래요</button>
    <button class="b" id="cheerNext">다음 글자 →</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* =====================================================================
   1. 한글 낱자 획 데이터  (각 낱자 로컬 좌표 0~100)
      획은 그리는 순서대로 들어 있고, 각 획의 점 순서가 곧 방향입니다.
   ===================================================================== */
function circlePts(cx, cy, rx, ry){
  var p = [], n = 64;
  for(var i=0;i<=n;i++){
    var a = (-90 - 360*i/n) * Math.PI/180;   // 위에서 시작해 반시계 방향
    p.push([cx + rx*Math.cos(a), cy + ry*Math.sin(a)]);
  }
  return p;
}
function S(pts, closed){ return {pts:pts, closed:!!closed}; }

var JAMO = {
  /* ---- 자음 ---- */
  'ㄱ': [S([[14,16],[86,16],[86,92]])],
  'ㄴ': [S([[14,10],[14,86],[88,86]])],
  'ㄷ': [S([[14,16],[88,16]]),
         S([[14,16],[14,86],[88,86]])],
  'ㄹ': [S([[14,14],[86,14],[86,48]]),
         S([[12,48],[88,48]]),
         S([[14,48],[14,88],[88,88]])],
  'ㅁ': [S([[14,14],[14,86]]),
         S([[14,14],[88,14],[88,86]]),
         S([[14,86],[88,86]])],
  'ㅂ': [S([[16,14],[16,90]]),
         S([[84,14],[84,90]]),
         S([[16,52],[84,52]]),
         S([[16,90],[84,90]])],
  'ㅅ': [S([[50,10],[12,90]]),
         S([[50,10],[88,82]])],
  'ㅇ': [S(circlePts(50,50,36,37), true)],
  'ㅈ': [S([[14,16],[58,16],[14,88]]),          /* 가로에서 꺾어 왼쪽 삐침까지 */
         S([[58,18],[88,86]])],                   /* 오른쪽 파임 */
  'ㅊ': [S([[54,4],[48,14]]),                    /* 꼭지 */
         S([[14,20],[58,20],[14,88]]),
         S([[58,22],[88,86]])],
  'ㅋ': [S([[14,16],[86,16],[86,92]]),
         S([[16,54],[70,54]])],
  'ㅌ': [S([[14,16],[88,16]]),
         S([[14,52],[88,52]]),
         S([[14,16],[14,86],[88,86]])],
  'ㅍ': [S([[14,16],[86,16]]),
         S([[28,16],[28,86]]),
         S([[72,16],[72,86]]),
         S([[14,86],[86,86]])],
  'ㅎ': [S([[54,4],[48,14]]),
         S([[16,30],[84,30]]),
         S(circlePts(50,64,31,27), true)],

  /* ---- 모음 ---- */
  'ㅏ': [S([[36,8],[36,94]]), S([[36,50],[92,50]])],
  'ㅑ': [S([[36,8],[36,94]]), S([[36,32],[92,32]]), S([[36,66],[92,66]])],
  'ㅓ': [S([[8,50],[64,50]]), S([[64,8],[64,94]])],
  'ㅕ': [S([[8,32],[64,32]]), S([[8,66],[64,66]]), S([[64,8],[64,94]])],
  'ㅗ': [S([[50,18],[50,66]]), S([[6,66],[94,66]])],
  'ㅛ': [S([[34,18],[34,66]]), S([[66,18],[66,66]]), S([[6,66],[94,66]])],
  'ㅜ': [S([[6,32],[94,32]]), S([[50,32],[50,84]])],
  'ㅠ': [S([[6,32],[94,32]]), S([[34,32],[34,84]]), S([[66,32],[66,84]])],
  'ㅡ': [S([[6,50],[94,50]])],
  'ㅣ': [S([[50,6],[50,94]])],
  'ㅐ': [S([[26,8],[26,94]]), S([[26,50],[62,50]]), S([[86,8],[86,94]])],
  'ㅔ': [S([[6,50],[54,50]]), S([[54,8],[54,94]]), S([[86,8],[86,94]])],
  'ㅒ': [S([[16,8],[16,94]]), S([[16,32],[50,32]]), S([[16,66],[50,66]]), S([[82,8],[82,94]])],
  'ㅖ': [S([[6,32],[44,32]]), S([[6,66],[44,66]]), S([[44,8],[44,94]]), S([[80,8],[80,94]])]
};
/* 복합모음 : ㅗ·ㅜ가 초성 아래로 걸쳐 놓이는 넓은 모양 (가로 200 단위) */
var MIXED = {
  'ㅘ': [S([[95,36],[95,62]]), S([[10,62],[172,62]]), S([[172,4],[172,94]]), S([[172,40],[198,40]])],
  'ㅙ': [S([[80,36],[80,62]]), S([[8,62],[158,62]]), S([[158,4],[158,94]]), S([[158,40],[182,40]]), S([[190,4],[190,94]])],

function jamoStrokes(name){
  var out = [], i, k, src;
  if(COMPOSITE[name]){
    for(i=0;i<COMPOSITE[name].length;i++){
      var c = COMPOSITE[name][i];
      src = jamoStrokes(c[0]);
      for(k=0;k<src.length;k++){
        out.push({closed:src[k].closed, pts:src[k].pts.map(function(p){
          return [c[1] + p[0]*c[3], c[2] + p[1]*c[4]];
        })});
      }
    }
    return out;
  }
  src = JAMO[name] || MIXED[name];
  if(!src) return [];
  for(k=0;k<src.length;k++) out.push({closed:src[k].closed, pts:src[k].pts});
  return out;
}

var CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
var JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
var JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
var V_VOWELS = {'ㅏ':1,'ㅑ':1,'ㅓ':1,'ㅕ':1,'ㅣ':1,'ㅐ':1,'ㅔ':1,'ㅒ':1,'ㅖ':1};   /* 세로 모음 */
var MIX_VOWELS = {'ㅘ':1,'ㅙ':1,'ㅚ':1,'ㅝ':1,'ㅞ':1,'ㅟ':1,'ㅢ':1};              /* 초성 아래로 걸치는 모음 */
/* 배치표 : [x, y, w, h] (음절 로컬 0~1000) */
var LAYOUT = {
  V: { noJong:{ cho:[80,225,380,450],  jung:[520,140,405,660] },
       jong:  { cho:[62,112,335,405],  jung:[455,95,470,455], jong:[330,648,350,292] } },
  H: { noJong:{ cho:[250,170,500,350], jung:[110,560,780,235] },
       jong:  { cho:[235,88,530,320],  jung:[110,462,780,165], jong:[330,650,350,292] } },
  M: { noJong:{ cho:[70,110,400,400], jung:[230,80,690,780] },
       jong:  { cho:[60,80,360,340],  jung:[200,60,660,520], jong:[330,648,350,292] } }
};
/* 복합모음 배치 : ㅗ계열은 초성 아래로 걸치고, ㅜ·ㅡ계열은 초성 오른쪽에서 시작 */
var MIX_RECT = {
  low: { noJong:[240,80,680,780], jong:[210,60,650,520] },
  mid: { noJong:[440,80,460,780], jong:[410,60,430,520] }
};
var MIX_KIND = {'ㅘ':'low','ㅙ':'low','ㅚ':'low','ㅝ':'mid','ㅞ':'mid','ㅟ':'mid','ㅢ':'mid'};

function decompose(ch){
  var code = ch.charCodeAt(0) - 0xAC00;
  if(code < 0 || code > 11171) return null;
  return { cho: CHO[Math.floor(code/588)],
           jung: JUNG[Math.floor((code%588)/28)],
           jong: JONG[code%28] };
}
function buildLetter(ch){
  var d = decompose(ch);
  if(!d){
    /* 낱자(자음·모음) 하나만 쓰는 경우 */
    if(JAMO[ch] || COMPOSITE[ch]){
      var box;
      if(V_VOWELS[ch]) box = [300,120,400,760];
      else if('ㅗㅛㅜㅠㅡ'.indexOf(ch) >= 0) box = [140,340,720,300];
      else box = [175,175,650,650];
      return jamoStrokes(ch).map(function(s){
        return { key:'cho', closed:s.closed, lw:90, pts:s.pts.map(function(p){
          return [ box[0] + p[0]/100*box[2], box[1] + p[1]/100*box[3] ];
        })};
      });
    }
    return [];
  }
  var isMix = !!MIX_VOWELS[d.jung];
  var isV = !!V_VOWELS[d.jung];
  var hasJong = !!d.jong;
  var conf = isMix ? LAYOUT.M : (isV ? LAYOUT.V : LAYOUT.H);
  conf = hasJong ? conf.jong : conf.noJong;
  var order = [['cho',d.cho],['jung',d.jung]];
  if(hasJong) order.push(['jong',d.jong]);
  var jmix = isMix ? (hasJong ? MIX_RECT[MIX_KIND[d.jung]].jong : MIX_RECT[MIX_KIND[d.jung]].noJong) : null;
  var out = [];
  for(var o=0;o<order.length;o++){
    var key = order[o][0], jamo = order[o][1];
    var r = (key === 'jung' && isMix) ? jmix : conf[key];
    if(!r || !jamo) continue;
    var bw = (key === 'jung' && isMix) ? 200 : 100;
    var strokes = jamoStrokes(jamo);
    for(var s=0;s<strokes.length;s++){
      out.push({ key:key, closed:strokes[s].closed, pts:strokes[s].pts.map(function(p){
        return [ r[0] + p[0]/bw*r[2], r[1] + p[1]/100*r[3] ];
      })});
    }
  }
  return out;
}

/* =====================================================================
   3. 기하 유틸
   ===================================================================== */
function prep(st){
  var cum=[0], len=0;
  for(var i=1;i<st.pts.length;i++){
    len += Math.hypot(st.pts[i][0]-st.pts[i-1][0], st.pts[i][1]-st.pts[i-1][1]);
    cum.push(len);
  }
  st.cum = cum; st.len = len || 1;
  return st;
}
function pointAt(st, t){
  t = Math.max(0, Math.min(1, t));
  var target = st.len * t;
  for(var i=1;i<st.pts.length;i++){
    if(st.cum[i] >= target){
      var seg = st.cum[i]-st.cum[i-1] || 1;
      var u = (target - st.cum[i-1]) / seg;
      var a = st.pts[i-1], b = st.pts[i];
      return [a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u];
    }
  }
  return st.pts[st.pts.length-1].slice();
}
function sliceStroke(st, t){
  var target = st.len * t, out = [st.pts[0]];
  for(var i=1;i<st.pts.length;i++){
    if(st.cum[i] <= target){ out.push(st.pts[i]); }
    else {
      var seg = st.cum[i]-st.cum[i-1] || 1;
      var u = (target - st.cum[i-1]) / seg;
      var a = st.pts[i-1], b = st.pts[i];
      out.push([a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u]);
      break;
    }
  }
  return out;
}
function project(st, p){
  var best = {d:1e9, t:0};
  for(var i=1;i<st.pts.length;i++){
    var a = st.pts[i-1], b = st.pts[i];
    var vx = b[0]-a[0], vy = b[1]-a[1];
    var l2 = vx*vx + vy*vy;
    if(l2 < 1e-9) continue;
    var u = ((p[0]-a[0])*vx + (p[1]-a[1])*vy) / l2;
    u = Math.max(0, Math.min(1, u));
    var x = a[0]+vx*u, y = a[1]+vy*u;
    var d = Math.hypot(p[0]-x, p[1]-y);
    if(d < best.d) best = { d:d, t:(st.cum[i-1] + u*Math.sqrt(l2)) / st.len };
  }
  return best;
}

function pad2(n){ return (n < 10 ? '0' : '') + n; }
function ymd(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function todayKey(){ return ymd(new Date()); }
function dayRec(key){
  if(!data.days[key]) data.days[key] = { n:0, chars:{} };
  if(!data.days[key].chars) data.days[key].chars = {};
  return data.days[key];
}
function dayOf(key){
  var r = data.days[key];
  if(!r || !r.chars) return { n:0, chars:{} };
  return r;
}
function totalAttendance(){
  var c = 0, k;
  for(k in data.days){ if(data.days[k] && data.days[k].n > 0) c++; }
  return c;
}
function streakDays(){
  var d = new Date(), c = 0;
  if(dayOf(ymd(d)).n === 0) d.setDate(d.getDate() - 1);   /* 오늘 아직 안 했으면 어제까지 */
  while(dayOf(ymd(d)).n > 0){ c++; d.setDate(d.getDate() - 1); }
  return c;
}

    host.innerHTML = '<span class="tempty">오늘은 아직 쓴 글자가 없어요. 하나 써 볼까요?</span>';
    return;
  }
  host.innerHTML = keys.map(function(k){
    var n = rec.chars[k];
    return '<span class="tchip">' + k + (n > 1 ? ' ×' + n : '') + '</span>';
  }).join('');
}
var calY = new Date().getFullYear(), calM = new Date().getMonth();
function renderCal(){

/* =====================================================================
   8. 글자 열기
   ===================================================================== */
function partLabel(ch){
  var d = decompose(ch);
  if(!d) return '';
  var parts = [d.cho, d.jung];
  if(d.jong) parts.push(d.jong);
  return parts.join(' · ');
}
function buildWord(word){
  var chars = Array.from(word);
  var n = chars.length;
  var gap = n > 1 ? 80 : 0;
  var regionW = (1000 - gap*(n-1)) / n;
  var s = regionW / 1000;
  var yOff = (1000 - regionW) / 2;
  var strokes = [], regions = [];
  chars.forEach(function(ch, si){
    var x0 = si * (regionW + gap);
    regions.push({ x0:x0, w:regionW, y0:yOff });
    buildLetter(ch).forEach(function(p){
      strokes.push({
        key: p.key, closed: p.closed, sylScale: s, lw: p.lw,
        pts: p.pts.map(function(pt){ return [ x0 + pt[0]*s, yOff + pt[1]*s ]; })
      });
    });
  });
  strokes.forEach(function(st, i){
    st.idx = i;
    if(st.lw == null) st.lw = (st.key === 'jong' ? 37 : 46) * s;
    else st.lw = st.lw * s;
    prep(st);
  });
  return { word: word, s: s, strokes: strokes, regions: regions };
}
function openLetter(i){
  if(i < 0 || i >= curList.length) return;
  curIndex = i;
  var it = curList[i];
  var w = buildWord(it.ch);
  if(!w.strokes.length){ toast('이 글자는 아직 준비 중이에요'); return; }
  model = w;
  model.idx = 0;
  attempt = null;
  animating = false; demoIndex = -1; demoProgress = 0;
  wLetter.textContent = it.ch;
  wParts.textContent = partLabel(it.ch) || it.name || '';
  showView('write');
  btnPrev.disabled = i <= 0;
  btnNext.disabled = i >= curList.length - 1;
  updateProgress();
  requestAnimationFrame(function(){ fitCanvas(); });
}
function updateProgress(){
  if(!model) return;
  var total = model.strokes.length;
  wProg.textContent = model.idx >= total ? '완성! ⭐' : (model.idx + 1) + ' / ' + total + ' 획';
}

/* =====================================================================
   9. 캔버스
   ===================================================================== */
function fitCanvas(){
  var w = stage.clientWidth - 20, h = stage.clientHeight - 12;
  var size = Math.max(160, Math.floor(Math.min(w, h)));
  var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  pad.style.width = size + 'px';
  pad.style.height = size + 'px';
  pad.width = Math.round(size * dpr);
  pad.height = Math.round(size * dpr);
  render();
}
function render(){
  if(!pad.width) return;
  var W = pad.width;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0, 0, W, W);
  if(!model) return;
  var k = W / 1000;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  /* 원고지 보조선 (4분할) */
  if(guideOn){
    model.regions.forEach(function(r){
      ctx.save();
      ctx.strokeStyle = '#F1DFCC';
      ctx.lineWidth = 3;
      roundRect(ctx, r.x0 + 22, r.y0 + 22, r.w - 44, r.w - 44, 26);
      ctx.stroke();
      ctx.setLineDash([13, 15]);
      ctx.strokeStyle = '#F7E9DA';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(r.x0 + r.w/2, r.y0 + 30); ctx.lineTo(r.x0 + r.w/2, r.y0 + r.w - 30);
      ctx.moveTo(r.x0 + 30, r.y0 + r.w/2); ctx.lineTo(r.x0 + r.w - 30, r.y0 + r.w/2);
      ctx.stroke();
      ctx.restore();
    });
  }

  for(var i=0;i<model.strokes.length;i++){
    var st = model.strokes[i];
    if(animating){
      if(i < demoIndex){ drawStroke(st.pts, st.lw, '#FF95B4'); }
      else if(i === demoIndex){ drawStroke(sliceStroke(st, demoProgress), st.lw, '#FF95B4'); }
      else { drawStroke(st.pts, st.lw, '#EFDFCF'); }
    } else if(i < model.idx){
      drawStroke(st.pts, st.lw, '#FF7FA3');
    } else {
      drawStroke(st.pts, st.lw, '#EFDFCF');
    }
  }

  if(animating && demoIndex >= 0){
    var tip = pointAt(model.strokes[demoIndex], demoProgress);
    ctx.beginPath(); ctx.arc(tip[0], tip[1], 15, 0, Math.PI*2);
    ctx.fillStyle = '#F2608A'; ctx.fill();
  }

  if(!animating){
    var cur = model.strokes[model.idx];
    if(cur){
      ctx.save();
      ctx.setLineDash([15, 17]);
      ctx.lineWidth = Math.max(4, cur.lw * 0.3);
      ctx.strokeStyle = '#FBAEC5';
      ctx.beginPath();
      ctx.moveTo(cur.pts[0][0], cur.pts[0][1]);
      for(var j=1;j<cur.pts.length;j++) ctx.lineTo(cur.pts[j][0], cur.pts[j][1]);
      ctx.stroke();
      ctx.restore();
      drawArrow(cur);
      var label = String(model.idx + 1);
      drawBadge(cur.pts[0], label, cur.lw);
    }
    if(attempt && attempt.points.length > 1){
      drawStroke(attempt.points, cur ? cur.lw : 46, 'rgba(255,127,163,.45)');
    }
  }
}
function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y, x+w, y+h, r);
  c.arcTo(x+w, y+h, x, y+h, r);
  c.arcTo(x, y+h, x, y, r);
  c.arcTo(x, y, x+w, y, r);
  c.closePath();
}
function drawStroke(pts, lw, color){
  if(!pts || pts.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.lineWidth = lw;
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
}
function drawArrow(st){
  var t = 0.78;
  var p = pointAt(st, t), q = pointAt(st, Math.min(1, t + 0.06));
  var dx = q[0]-p[0], dy = q[1]-p[1];
  var len = Math.hypot(dx, dy) || 1;
  dx /= len; dy /= len;
  var size = Math.max(20, Math.min(30, st.len * 0.055));
  var px = -dy, py = dx;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(p[0] + dx*size, p[1] + dy*size);
  ctx.lineTo(p[0] - dx*size*0.55 + px*size*0.85, p[1] - dy*size*0.55 + py*size*0.85);
  ctx.lineTo(p[0] - dx*size*0.55 - px*size*0.85, p[1] - dy*size*0.55 - py*size*0.85);
  ctx.closePath();
  ctx.fillStyle = '#FBAEC5';
  ctx.fill();
  ctx.restore();
}
function drawBadge(pt, label, lw){
  var r = Math.max(30, Math.min(42, lw * 0.95));
  ctx.save();
  ctx.shadowColor = 'rgba(242,96,138,.35)';
  ctx.shadowBlur = 12; ctx.shadowOffsetY = 3;
  ctx.beginPath(); ctx.arc(pt[0], pt[1], r, 0, Math.PI*2);
  ctx.fillStyle = '#FF7FA3'; ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '800 ' + Math.round(r*1.15) + 'px -apple-system, "Apple SD Gothic Neo", sans-serif';
  ctx.fillText(label, pt[0], pt[1] + r*0.06);
}

/* =====================================================================
   10. 따라쓰기 검사 (시작점 · 방향 · 순서)
   ===================================================================== */
function pointerLocal(e){
  var r = pad.getBoundingClientRect();
  return [ (e.clientX - r.left) / r.width * 1000, (e.clientY - r.top) / r.height * 1000 ];
}
function toast(msg){
  bubble.textContent = msg;
  bubble.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(function(){ bubble.classList.remove('show'); }, 2600);
}
function onDown(e){
  if(!model || animating || !model.strokes.length) return;
  if(model.idx >= model.strokes.length) return;
  if(attempt){
    /* 애플펜슬이 먼저 닿으면 손바닥 터치를 밀어내고 새로 시작 */
    if(e.pointerType === 'pen' && attempt.type !== 'pen'){ attempt = null; }
    else return;
  }
  e.preventDefault();
  try { pad.setPointerCapture(e.pointerId); } catch(err){}
  var p = pointerLocal(e);
  var st = model.strokes[model.idx];
  var s = st.sylScale;
  var tolStart = Math.max(52, 118 * s);
  var d0 = Math.hypot(p[0]-st.pts[0][0], p[1]-st.pts[0][1]);

  if(d0 > tolStart){
    /* 다른 획의 시작점을 눌렀는지 확인 → 순서 안내 */
    var hit = -1;
    for(var i=0;i<model.strokes.length;i++){
      if(i === model.idx) continue;
      var q = model.strokes[i].pts[0];
      if(Math.hypot(p[0]-q[0], p[1]-q[1]) < tolStart){ hit = i; break; }
    }
    var lastPt = st.pts[st.pts.length-1];
    if(Math.hypot(p[0]-lastPt[0], p[1]-lastPt[1]) < tolStart){
      toast('여기는 끝이에요! ' + (model.idx+1) + '번 동그라미에서 시작해요!');
    } else if(hit >= 0 && hit > model.idx){
      toast('여기는 ' + (hit+1) + '번 획이에요. ' + (model.idx+1) + '번부터 써 볼까요?');
    } else {
      toast((model.idx+1) + '번 동그라미에서 시작해요!');
    }
    sfx('warn');
    return;
  }
  attempt = { idx: model.idx, pid: e.pointerId, type: e.pointerType, points:[p], bestT:0, dirChecked:false, offTrack:false };
  sfx('start');
  penStart(e);
  render();
}
function onMove(e){
  if(!attempt || e.pointerId !== attempt.pid) return;
  e.preventDefault();
  var p = pointerLocal(e);
  var st = model.strokes[attempt.idx];
  var s = st.sylScale;
  var latTol = Math.max(58, 132 * s);
  var last = attempt.points[attempt.points.length-1];
  if(Math.hypot(p[0]-last[0], p[1]-last[1]) < 3) return;
  attempt.points.push(p);
  penMove(e);

  /* 처음 움직일 때 방향이 반대면 바로 안내 */
  if(!attempt.dirChecked && attempt.points.length >= 3){
    var a = attempt.points[0], b = attempt.points[attempt.points.length-1];
    var mv = [b[0]-a[0], b[1]-a[1]];
    var ml = Math.hypot(mv[0], mv[1]);
    if(ml > 24 * s){
      var t1 = pointAt(st, Math.min(0.08, 40/st.len));
      var tv = [t1[0]-st.pts[0][0], t1[1]-st.pts[0][1]];
      var tl = Math.hypot(tv[0], tv[1]) || 1;
      var cos = (mv[0]*tv[0] + mv[1]*tv[1]) / (ml * tl);
      attempt.dirChecked = true;
      if(cos < -0.25){
        attempt = null;
        penStop();
        toast('화살표 방향으로 그어 볼까요?');
        sfx('warn');
        render();
        return;
      }
    }
  }

  var pr = project(st, p);
  var t = pr.t;
  /* 닫힌 획(ㅇ)은 시작 근처가 곧 끝이므로 이어 붙임 */
  if(st.closed && t < 0.12 && attempt.bestT > 0.6) t = 1;
  if(t > attempt.bestT) attempt.bestT = t;

  if(pr.d > latTol){
    if(!attempt.offTrack){
      attempt.offTrack = true;
      toast('점선을 따라 그어 볼까요?');
    }
  } else if(attempt.offTrack){
    attempt.offTrack = false;
  }

  /* 완성 판정 */
  var end = st.pts[st.pts.length-1];
  var endTol = Math.max(58, 140 * s);
  if(attempt.bestT >= 0.9 && Math.hypot(p[0]-end[0], p[1]-end[1]) < endTol){
    finishStroke();
    return;
  }
  requestRender();
}
function onUp(e){
  if(!attempt || e.pointerId !== attempt.pid) return;
  penStop();
  var st = model.strokes[attempt.idx];
  var s = st.sylScale;
  var end = st.pts[st.pts.length-1];
  var p = attempt.points[attempt.points.length-1];
  var endTol = Math.max(58, 140 * s);
  if(attempt.bestT >= 0.82 && Math.hypot(p[0]-end[0], p[1]-end[1]) < endTol * 1.6){
    finishStroke();
    return;
  }
  if(attempt.bestT >= 0.97){
    finishStroke();
    return;
  }
  attempt = null;
  if(st.closed) toast('동그라미를 끝까지 빙 둘러 볼까요?');
  else if(p && Math.hypot(p[0]-st.pts[0][0], p[1]-st.pts[0][1]) < 40) toast((model.idx+1) + '번 동그라미에서 시작해요!');
  else toast('조금만 더! ' + (model.idx+1) + '번 획을 끝까지 그어 볼까요?');
  sfx('warn');
  render();
}
function finishStroke(){
  var st = model.strokes[attempt.idx];
  attempt = null;
  penStop();
  model.idx++;
  sfx('stroke');
  updateProgress();
  if(model.idx >= model.strokes.length){
    render();
    completeLetter();
  } else {
    render();
  }
}
var rafPending = false;
function requestRender(){
  if(rafPending) return;
  rafPending = true;
  requestAnimationFrame(function(){ rafPending = false; render(); });
}

   11. 완성 · 축하

function completeLetter(){

function confetti(){

/* =====================================================================
   12. 소리
   ===================================================================== */
var ac = null;
function audio(){
  if(!ac){
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ ac = null; }
  }
  if(ac && ac.state === 'suspended'){ try { ac.resume(); } catch(e){} }
  return ac;
}
function tone(freq, dur, when, vol, type){
  var a = audio();
  if(!a) return;
  var t0 = a.currentTime + (when || 0);
  var o = a.createOscillator();
  var g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function sfx(kind){
  if(kind === 'start'){ tone(660, 0.09, 0, 0.06, 'sine'); }
  else if(kind === 'stroke'){ tone(784, 0.10, 0, 0.10, 'sine'); tone(1046, 0.12, 0.05, 0.07, 'sine'); }
  else if(kind === 'warn'){ tone(300, 0.13, 0, 0.07, 'triangle'); }
  else if(kind === 'win'){ [523,659,784,1046].forEach(function(f,i){ tone(f, 0.28, i*0.09, 0.12, 'sine'); }); }
  else if(kind === 'tap'){ tone(520, 0.06, 0, 0.05, 'sine'); }
}

/* ---------------------------------------------------------------
   연필 사각사각 소리  (루프 노이즈 + 밴드패스, 움직일 때만)
   --------------------------------------------------------------- */
var pen = { ready:false, src:null, gain:null, filt:null, lastX:0, lastY:0, lastPT:0, lastMove:0, target:0, raf:0 };
function penEnsure(){
  var a = audio();
  if(!a) return false;
  if(pen.ready) return true;
  var sr = a.sampleRate;
  var len = Math.floor(sr * 1.6);
  var buf = a.createBuffer(1, len, sr);
  var d = buf.getChannelData(0);
  var grain = Math.max(8, Math.round(sr / 42));   /* 초당 42개의 결 */
  var env = 0.6, exc = 0.6;
  for(var i = 0; i < len; i++){
    if(i % grain === 0){ exc = 0.22 + Math.random() * 0.78; }
    env += (exc - env) * 0.028;
    d[i] = (Math.random() * 2 - 1) * env;
  }
  var src = a.createBufferSource();
  src.buffer = buf; src.loop = true;
  var hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 800; hp.Q.value = 0.4;
  var bp1 = a.createBiquadFilter(); bp1.type = 'bandpass'; bp1.frequency.value = 2500; bp1.Q.value = 0.75;
  var bp2 = a.createBiquadFilter(); bp2.type = 'bandpass'; bp2.frequency.value = 1150; bp2.Q.value = 1.3;
  var g2 = a.createGain(); g2.gain.value = 0.45;
  var g = a.createGain(); g.gain.value = 0.0001;
  src.connect(hp);
  hp.connect(bp1); bp1.connect(g);
  hp.connect(bp2); bp2.connect(g2); g2.connect(g);
  g.connect(a.destination);
  try { src.start(0); } catch(e) {}
  pen.src = src; pen.gain = g; pen.filt = bp1; pen.ready = true;
  return true;
}
function penStart(e){
  if(!penEnsure()) return;
  var a = ac;
  var now = performance.now();
  pen.lastX = e.clientX; pen.lastY = e.clientY;
  pen.lastPT = now; pen.lastMove = now; pen.target = 0.02;
  try {
    pen.gain.gain.cancelScheduledValues(a.currentTime);
    pen.gain.gain.setTargetAtTime(0.02, a.currentTime, 0.02);
  } catch(err){}
  if(!pen.raf) pen.raf = requestAnimationFrame(penLoop);
}
function penMove(e){
  if(!pen.ready) return;
  var a = ac;
  var now = performance.now();
  var dt = Math.max(1, Math.min(64, now - pen.lastPT));
  var dist = Math.hypot(e.clientX - pen.lastX, e.clientY - pen.lastY);
  var spd = dist / dt;                       /* px / ms */
  pen.lastX = e.clientX; pen.lastY = e.clientY; pen.lastPT = now; pen.lastMove = now;
  pen.target = Math.min(0.16, 0.018 + Math.min(1.6, spd) * 0.078);
  try {
    pen.gain.gain.setTargetAtTime(pen.target, a.currentTime, 0.045);
    pen.filt.frequency.setTargetAtTime(1900 + Math.min(1400, spd * 700), a.currentTime, 0.07);
  } catch(err){}
}
function penStop(){
  if(!pen.ready) return;
  var a = ac;
  pen.target = 0.0001;
  try {
    pen.gain.gain.cancelScheduledValues(a.currentTime);
    pen.gain.gain.setTargetAtTime(0.0001, a.currentTime, 0.03);
  } catch(err){}
}
function penLoop(){
  pen.raf = 0;
  if(!pen.ready) return;
  var idle = performance.now() - pen.lastMove;
  if(idle > 110 && pen.target > 0.001){
    pen.target = 0.0001;
    try { pen.gain.gain.setTargetAtTime(0.0001, ac.currentTime, 0.05); } catch(e){}
  }
  if(idle < 420) pen.raf = requestAnimationFrame(penLoop);
}

/* ---------------------------------------------------------------
   배경음악 : 오르골·칼림바풍 자장가 루프 (Web Audio 합성)
   --------------------------------------------------------------- */
var BGM_KEY = 'yoonseo-hangul-bgm';
var SONG = {
  bpm: 68, bars: 16,
  /* [시작박, midi, 길이(박), 세기] */
  mel: [
    [0,76,1,1],[1,79,1,1],[2,81,2,1],
    [4,79,2,.95],[6,76,2,.9],
    [8,74,1,.9],[9,76,1,1],[10,79,2,1],
    [12,76,1,.85],[13,74,1,.85],[14,72,2,1],
    [16,72,1,.9],[17,74,1,.95],[18,76,2,1],
    [20,79,1,.95],[21,81,1,1],[22,79,2,1],
    [24,76,1,.9],[25,74,1,.9],[26,79,2,1],
    [28,72,4,.9],
    [32,81,1,1],[33,79,1,.95],[34,76,2,1],
    [36,74,2,.95],[38,76,2,1],
    [40,79,1,1],[41,76,1,.9],[42,74,2,.9],
    [44,72,2,1],[46,74,2,.9],
    [48,76,1,.95],[49,79,1,1],[50,81,2,1],
    [52,84,1,1],[53,81,1,.9],[54,79,2,1],
    [56,76,2,.95],[58,74,1,.9],[59,72,1,.9],
    [60,72,4,.85]
  ],
  bass: [
    [0,48,4],[4,45,4],[8,41,4],[12,48,4],
    [16,48,4],[20,45,4],[24,43,4],[28,48,4],
    [32,41,4],[36,43,4],[40,45,4],[44,41,4],
    [48,48,4],[52,45,4],[56,43,4],[60,48,4]
  ],
  fifth: [
    [2,55],[6,52],[10,48],[14,55],
    [18,55],[22,52],[26,50],[30,55],
    [34,48],[38,50],[42,52],[46,48],
    [50,55],[54,52],[58,50],[62,55]
  ],
  spark: [
    [30,84,.55],[30.5,88,.5],[31,91,.48],
    [62,88,.5],[62.5,91,.45],[63,96,.4]
  ]
};
var bgm = { on:true, gain:null, timer:null, next:0, beat:0, playing:false, spb:60/68 };
try { bgm.on = (localStorage.getItem(BGM_KEY) !== 'off'); } catch(e){}
function bgmSave(){ try { localStorage.setItem(BGM_KEY, bgm.on ? 'on' : 'off'); } catch(e){} }
function bgmInit(){
  var a = audio();
  if(!a) return false;
  if(!bgm.gain){
    var g = a.createGain();
    g.gain.value = 0.0001;
    g.connect(a.destination);
    bgm.gain = g;
  }
  return true;
}
function bgmNote(t, midi, dur, vol, bright){
  var a = ac;
  if(!a || !bgm.gain) return;
  var f = 440 * Math.pow(2, (midi - 69) / 12);
  var g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  g.connect(bgm.gain);
  var o1 = a.createOscillator();
  o1.type = 'triangle'; o1.frequency.setValueAtTime(f, t);
  var o2 = a.createOscillator();
  o2.type = 'sine'; o2.frequency.setValueAtTime(f * 2, t);
  var g2 = a.createGain(); g2.gain.value = (bright == null ? 0.2 : bright);
  o1.connect(g);
  o2.connect(g2); g2.connect(g);
  o1.start(t); o1.stop(t + dur + 0.05);
  o2.start(t); o2.stop(t + dur + 0.05);
}
function bgmScheduleBeat(beat, t){
  var spb = bgm.spb, i, n;
  for(i = 0; i < SONG.mel.length; i++){
    n = SONG.mel[i];
    if(n[0] === beat) bgmNote(t, n[1], Math.max(0.95, n[2] * spb * 1.3), 0.085 * (n[3] || 1), 0.22);
  }
  for(i = 0; i < SONG.bass.length; i++){
    n = SONG.bass[i];
    if(n[0] === beat) bgmNote(t, n[1], 3.2, 0.062, 0.05);
  }
  for(i = 0; i < SONG.fifth.length; i++){
    n = SONG.fifth[i];
    if(n[0] === beat) bgmNote(t, n[1], 1.8, 0.032, 0.04);
  }
  for(i = 0; i < SONG.spark.length; i++){
    n = SONG.spark[i];
    if(n[0] === beat) bgmNote(t, n[1], 1.6, 0.05 * (n[2] || 1), 0.3);
  }
}
var BGM_GRID = 0.5;
function bgmTick(){
  var a = ac;
  if(!a || !bgm.playing || !bgm.gain) return;
  if(a.state === 'suspended'){ try { a.resume(); } catch(e){} }
  if(bgm.next < a.currentTime - 0.6) bgm.next = a.currentTime + 0.06;   /* 잠든 사이 밀린 음은 건너뜀 */
  var guard = 0;
  while(bgm.next < a.currentTime + 0.85 && guard++ < 24){
    bgmScheduleBeat(bgm.beat, bgm.next);
    bgm.beat += BGM_GRID;
    if(bgm.beat >= SONG.bars * 4) bgm.beat -= SONG.bars * 4;
    bgm.next += bgm.spb * BGM_GRID;
  }
}
function bgmPlay(){
  if(!bgmInit()) return;
  var a = ac;
  bgm.on = true;
  if(!bgm.timer){
    bgm.beat = 0;
    bgm.next = a.currentTime + 0.2;
    bgm.playing = true;
    try {
      bgm.gain.gain.cancelScheduledValues(a.currentTime);
      bgm.gain.gain.setValueAtTime(Math.max(0.0001, bgm.gain.gain.value), a.currentTime);
      bgm.gain.gain.setTargetAtTime(0.55, a.currentTime, 0.7);
    } catch(e){}
    bgm.timer = setInterval(bgmTick, 120);
    bgmTick();
  } else {
    bgm.playing = true;
  }
}
function bgmPause(){
  bgm.playing = false;
  clearInterval(bgm.timer); bgm.timer = null;
  if(bgm.gain && ac){
    try {
      bgm.gain.gain.cancelScheduledValues(ac.currentTime);
      bgm.gain.gain.setValueAtTime(Math.max(0.0001, bgm.gain.gain.value), ac.currentTime);
      bgm.gain.gain.setTargetAtTime(0.0001, ac.currentTime, 0.22);
    } catch(e){}
  }
}
var btnMusic = document.getElementById('btnMusic');
function bgmPaint(){
  if(!btnMusic) return;
  btnMusic.classList.toggle('off', !bgm.on);
  btnMusic.setAttribute('aria-pressed', bgm.on ? 'true' : 'false');
  btnMusic.setAttribute('aria-label', bgm.on ? '배경음악 끄기' : '배경음악 켜기');
  var mi = btnMusic.querySelector('.mi'), mt = btnMusic.querySelector('.mt');
  if(mi) mi.textContent = bgm.on ? '🎵' : '🔇';
  if(mt) mt.textContent = bgm.on ? '배경음' : '음악 꺼짐';
}
if(btnMusic){
  btnMusic.addEventListener('click', function(e){
    e.stopPropagation();
    bgm.on = !bgm.on;
    bgmSave(); bgmPaint();
    if(bgm.on){ audio(); bgmPlay(); } else { bgmPause(); }
    sfx('tap');
  });
}
/* iOS : 첫 사용자 제스처에서 오디오를 깨우고 음악을 시작 */
var audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  audio();

}
document.addEventListener('pointerdown', unlockAudio, { capture:true, passive:true });
document.addEventListener('keydown', unlockAudio);
document.addEventListener('touchend', unlockAudio, { capture:true, passive:true });
document.addEventListener('visibilitychange', function(){

bgmPaint();

function speak(text){
  try {
    if(!('speechSynthesis' in window) || !text) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    u.rate = 0.82;
    u.pitch = 1.18;
    var vs = window.speechSynthesis.getVoices() || [];
    for(var i=0;i<vs.length;i++){
      if((vs[i].lang || '').toLowerCase().indexOf('ko') === 0){ u.voice = vs[i]; break; }
    }
    window.speechSynthesis.speak(u);
  } catch(e){}
}
function letterSpeech(){
  if(!curList[curIndex]) return;
  var ch = curList[curIndex].ch;
  if(ch.length === 1 && JAUM_NAMES[ch]) return JAUM_NAMES[ch];
  if(ch.length === 1 && MOEUM_SOUND[ch]) return MOEUM_SOUND[ch];
  return ch;
}

/* =====================================================================
   13. 획순 보기 애니메이션
   ===================================================================== */
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function playDemo(){
  if(!model || animating) return;
  audio();
  animating = true;
  attempt = null;
  demoIndex = 0; demoProgress = 0;
  var strokes = model.strokes;
  (async function(){
    for(var i=0;i<strokes.length;i++){
      demoIndex = i;
      var dur = 420 + Math.min(700, strokes[i].len * 0.55);
      var t0 = performance.now();
      await new Promise(function(res){
        function step(now){
          var u = Math.min(1, (now - t0) / dur);
          demoProgress = u;
          render();
          if(u < 1) requestAnimationFrame(step);
          else res();
        }
        requestAnimationFrame(step);
      });
      await sleep(140);
    }
    await sleep(320);
    demoIndex = -1; demoProgress = 0;
    animating = false;
    render();
  })();
}

/* ---------------- 테스트 훅 (?test=1 로 열었을 때만) ---------------- */
if(new URLSearchParams(location.search).has('test')){
  window.__t = {
    info: function(){
      if(!model) return null;
      var r = pad.getBoundingClientRect();
      var toClient = function(p){ return { x: r.left + p[0]/1000*r.width, y: r.top + p[1]/1000*r.height }; };
      return {
        word: model.word, idx: model.idx, total: model.strokes.length,
        rect: {w:r.width, h:r.height},
        strokes: model.strokes.map(function(st){
          return { i: st.idx, start: toClient(st.pts[0]), end: toClient(st.pts[st.pts.length-1]), len: st.len };
        })
      };
    },
    open: function(tabId, index){
      gotoTab(tabId);
      openLetter(index || 0);
      return true;
    },
    trace: function(strokeIdx, opts){
      opts = opts || {};
      var st = model.strokes[strokeIdx];
      if(!st) return 'no-stroke';
      var r = pad.getBoundingClientRect();
      var toClient = function(p){ return { x: r.left + p[0]/1000*r.width, y: r.top + p[1]/1000*r.height }; };
      var from = opts.from == null ? 0 : opts.from;
      var to = opts.to == null ? 1 : opts.to;
      var n = opts.steps || 36;
      var off = opts.offset || [0,0];
      var ev = function(type, pt){
        pad.dispatchEvent(new PointerEvent(type, {
          pointerId: 1, pointerType: 'touch', isPrimary: true, bubbles: true, cancelable: true,
          clientX: pt.x, clientY: pt.y, buttons: type === 'pointerup' ? 0 : 1
        }));
      };
      var anchor = pointAt(st, opts.flip ? from : 0);
      var aim = function(p){
        if(opts.flip) return [2*anchor[0]-p[0] + off[0], 2*anchor[1]-p[1] + off[1]];
        return [p[0] + off[0], p[1] + off[1]];
      };
      ev('pointerdown', toClient(aim(pointAt(st, from))));
      for(var i=1;i<=n;i++){
        var t = from + (to - from) * (i/n);
        ev('pointermove', toClient(aim(pointAt(st, t))));
      }
      ev('pointerup', toClient(aim(pointAt(st, to))));
      return { word: model.word, idx: model.idx, total: model.strokes.length };
    },
    state: function(){
      return { idx: model ? model.idx : -1, total: model ? model.strokes.length : 0, cheer: !document.getElementById('cheer').hidden, stars: data.total };
    },
    holdCheer: function(){ clearTimeout(cheerTimer); return true; },
    audio: function(){
      return {
        ctx: ac ? ac.state : 'none',
        unlocked: audioUnlocked,
        musicOn: bgm.on,
        musicRunning: !!bgm.timer,
        musicGain: bgm.gain ? +bgm.gain.gain.value.toFixed(4) : -1,
        musicBeat: bgm.beat,
        penReady: pen.ready,
        penGain: pen.ready ? +pen.gain.gain.value.toFixed(4) : -1,
        penTarget: +pen.target.toFixed(4),
        stored: (function(){ try { return localStorage.getItem(BGM_KEY); } catch(e){ return null; } })()
      };
    },
    music: function(on){
      if(on === undefined) return bgm.on;
      if(btnMusic) btnMusic.click();
      return bgm.on;
    },
    audit: function(){
      var out = [];
      TABS.forEach(function(tb){
        if(tb.id === 'star') return;
        tb.items().forEach(function(it){
          var w = buildWord(it.ch);
          var bad = [], tiny = [];
          w.strokes.forEach(function(st){
            for(var k=0;k<st.pts.length;k++){
              var p = st.pts[k];
              if(p[0] < -1 || p[0] > 1001 || p[1] < -1 || p[1] > 1001) bad.push(st.idx);
            }
            if(st.len < 8) tiny.push(st.idx);
          });
          out.push({ch:it.ch, strokes:w.strokes.length, out:bad, tiny:tiny, empty:w.strokes.length === 0});
        });
      });
      return out;
    }
  };
}
